<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        div {
            margin: 20px;
        }

        .content-box {
            background-color: orange;
            width: 300px;
            padding: 25px;
            border: 5px solid rgb(255, 209, 125);
            box-sizing: content-box;
            /*Tamanho total: soma width + padding + border */
        }
        .border-box {
            background-color: rgb(18, 211, 211);
            width: 300px;
            padding: 25px;
            border: 5px solid rgb(178, 255, 255);
            box-sizing: border-box;
            /*Tamanho total: width (300px) */
        }
    </style>
</head>

<body>
    <h1>Exemplos box-model e inline-level</h1>
    <p>Parágrafo é box-model (quebra de linha automaticamente), mas os <a href="#"> links são elementos inline-level</a>
        (permanecem na mesma linha)</p>

    <div class="content-box"> Content box (padrão) </div>
    <div class="border-box"> Border box </div>
</body>

</html>
